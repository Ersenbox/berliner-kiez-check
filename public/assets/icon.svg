<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="topCurve" d="M 50,125 A 75,75 0 0,1 200,125" fill="none"/>
  </defs>
  
  <!-- RED CIRCLE BACKGROUND -->
  <circle cx="125" cy="125" r="122" fill="#E30613"/>
  
  <!-- WHITE OUTER BORDER -->
  <circle cx="125" cy="125" r="122" fill="none" stroke="white" stroke-width="7"/>
  
  <!-- INNER CIRCLE BORDER -->
  <circle cx="125" cy="125" r="116" fill="none" stroke="white" stroke-width="1.5"/>
  
  <!-- "BERLINER" TEXT (TOP) -->
  <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" letter-spacing="2" text-anchor="middle">
    <textPath xlink:href="#topCurve" startOffset="50%" text-anchor="middle">
      BERLINER
    </textPath>
  </text>
  
  <!-- "Kiez-Check" MAIN TEXT (CENTER) -->
  <text x="125" y="148" font-family="'Brush Script MT', 'Lucida Handwriting', cursive" font-size="72" font-weight="bold" font-style="italic" fill="white" text-anchor="middle" letter-spacing="-1">Kiez-Check</text>
  
  <!-- WHITE BRUSH STROKE (SMILE) -->
  <path d="M 60,175 Q 125,195 190,175" stroke="white" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
