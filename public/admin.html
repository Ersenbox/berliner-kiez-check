<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Berliner Kiez-Check Admin</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--paper:#EEF0EC;--ink:#1C2B39;--pink:#FF48B0;--blue:#0078BF;--yellow:#FFE800;--muted:#4A5866;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#141B22;--ink:#E9ECE6;--muted:#A9B3BC;--card:#1C252E}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--ink)}
header img,header svg{flex-shrink:0;max-width:64px;max-height:64px}
h1{margin:0 auto 0 0;font-size:20px;color:var(--blue)}
button,input{font:inherit;color:inherit}
button{border:2px solid var(--ink);background:var(--card);padding:6px 12px;font-weight:700;cursor:pointer}
button.ok{background:#1f9d55;color:#fff;border-color:#1f9d55}button.no{background:var(--pink);color:#1C2B39}button.del{background:none;color:var(--muted);border-color:var(--muted)}
button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{max-width:980px;margin:0 auto;padding:16px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-weight:700}
.it{display:grid;grid-template-columns:90px 1fr;gap:14px;border-top:1.5px solid var(--ink);padding:14px 0}
.it img,.ph{width:90px;height:90px;object-fit:cover;border:2px solid var(--ink)}.ph{background:var(--blue)}
.it h3{margin:0}.m{color:var(--muted);font-size:13px;margin:2px 0}
.note{background:var(--yellow);color:#1C2B39;padding:4px 8px;font-size:13px;margin:6px 0;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sp{display:grid;grid-template-columns:160px 1fr;gap:14px;border-top:1.5px solid var(--ink);padding:14px 0}
.sp img{width:160px;aspect-ratio:1200/630;object-fit:contain;background:#fff;border:2px solid var(--ink)}
.sp.off{opacity:.55}
.kv{font-size:13px;color:var(--muted);margin:2px 0}
.big{font-size:20px;font-weight:800}
.ed{display:grid;gap:10px;max-width:760px;border:2px solid var(--ink);background:var(--card);padding:14px;margin:10px 0}
.ed label{display:grid;gap:3px;font-weight:700;font-size:13px}
.ed input,.ed select{border:2px solid var(--ink);background:var(--paper);padding:7px;font:inherit;color:inherit;width:100%}
.ed .g3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.ed .g3{grid-template-columns:1fr}.sp{grid-template-columns:1fr}.sp img{width:100%}}
.ed .chkrow{display:flex;gap:16px;flex-wrap:wrap}
.ed .chkrow label{display:flex;gap:6px;align-items:center;font-weight:400}
.ed .chkrow input{width:auto}
#login{max-width:420px;margin:60px auto;padding:0 16px}#login input{width:100%;padding:10px;border:2px solid var(--ink);background:var(--card);margin:8px 0}
</style>
</head>
<body>
<div id="login">
  <h1>Berliner Kiez-Check Admin</h1>
  <p>Admin-Token eingeben (wird nur in diesem Tab gespeichert).</p>
  <input id="tok" type="password" autocomplete="off">
  <button id="loginBtn">Anmelden</button>
</div>
<div id="app" hidden>
  <header>
    <!-- LOGO: Verwendet neuestes SVG-Logo oder größtes verfügbares PNG -->
    <img id="adminLogo" src="https://raw.githubusercontent.com/Ersenbox/berliner-kiez-check/main/public/assets/logo.svg" alt="Kiez-Check" onerror="this.src='https://raw.githubusercontent.com/Ersenbox/berliner-kiez-check/main/public/assets/logo-kiez-check-128x128.png'">
    <h1>Berliner Kiez-Check Admin</h1>
    <button data-s="pending" aria-pressed="true">Zu prüfen</button>
    <button data-s="approved">Online</button>
    <button data-s="rejected">Abgelehnt</button>
    <button data-sec="sponsors">Sponsoren</button>
    <button data-sec="jobs">Jobs</button>
    <button data-sec="requests">Werbeanfragen</button>
    <button data-sec="posts">Kiez-Reporter</button>
    <button data-sec="stories">Stories</button>
    <button id="logout">Abmelden</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
    <div id="sec" hidden></div>
    <div id="edBox"></div>
  </main>
</div>
<script>
var TOKEN = sessionStorage.getItem('kc_admin') || '', ST = 'pending';
var $ = function (s) { return document.querySelector(s); };
function el(s) { return $(('#' + s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function call(p, body) {
  return fetch(p, { method: body ? 'POST' : 'GET', headers: Object.assign({ authorization: 'Bearer ' + TOKEN }, body ? { 'content-type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { if (r.status === 401) { logout(); throw new Error('auth'); } return r.json(); });
}
function logout() { TOKEN = ''; sessionStorage.removeItem('kc_admin'); $('#app').hidden = true; $('#login').hidden = false; }
function showSec(name) { if (!name) { el('sec').hidden = true; el('list').hidden = false; } else { el('sec').hidden = false; el('list').hidden = true; if (name === 'sponsors') loadSp(); else if (name === 'jobs') loadJobs(); else if (name === 'requests') loadReq(); else if (name === 'posts') loadPosts(); else if (name === 'stories') loadStories(); } }
function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  call('/api/admin/stats').then(function (s) {
    var c = {}; s.counts.forEach(function (x) { c[x.status] = x.n; });
    $('#stats').innerHTML = '<span>Zu prüfen: ' + (c.pending || 0) + '</span><span>Online: ' + (c.approved || 0) + '</span><span>Hervorgehoben: ' + s.featured + '</span><span>Umsatz 30 Tage: ' + (s.revenue30 / 100).toFixed(2).replace('.', ',') + ' €</span>';
  });
  list();
}
function list() {
  call('/api/admin/list?status=' + ST).then(function (j) {
    $('#list').innerHTML = j.items.length ? j.items.map(function (it) {
      return '<div class="it" data-id="' + esc(it.id) + '">' + (it.photo_key ? '<img src="/img/' + esc(it.photo_key) + '?v=' + it.updated_at + '" alt="">' : '<div class="ph"></div>') +
        '<div><h3>' + esc(it.name) + '</h3><p class="m">' + esc(it.kiez) + (it.kiez_note ? ' (' + esc(it.kiez_note) + ')' : '') + ' / ' + esc(it.category) + (it.cat_note ? ' (' + esc(it.cat_note) + ')' : '') + ' – ' + esc(it.address) + '</p>' +
        '<p class="m">' + esc(it.email) + (it.phone ? ' · ' + esc(it.phone) : '') + (it.website ? ' · <a href="' + esc(it.website) + '" target="_blank" rel="noopener">' + esc(it.website) + '</a>' : '') + (it.instagram ? ' · @' + esc(it.instagram) : '') + '</p>' +
        (it.mod_note ? '<div class="note">KI: ' + esc(it.mod_note) + '</div>' : '') +
        '<p>' + esc(it.desc_de) + '</p><p class="m">TR: ' + esc(it.desc_tr) + '</p>' +
        (it.featured_until > Date.now() ? '<p class="m"><b>Hervorgehoben bis ' + new Date(it.featured_until).toLocaleDateString('de') + '</b></p>' : '') +
        '<div class="row">' + (ST !== 'approved' ? '<button class="ok" data-a="approved">Freigeben</button>' : '') + (ST !== 'rejected' ? '<button class="no" data-a="rejected">Ablehnen</button>' : '') +
        (ST === 'approved' ? '<button data-a="edit">Bearbeiten</button>' : '') +
        '<button class="del" data-a="delete">Löschen</button></div></div></div>';
    }).join('') : '<p>Nichts zu tun. 🎉</p>';
  });
}
function fmtD(ms) { return ms ? new Date(ms).toLocaleDateString('de', { year: 'numeric', month: '2-digit', day: '2-digit' }) : ''; }
var SPS = [];
function loadSp() {
  call('/api/admin/sponsors').then(function (j) {
    SPS = j.items || [];
    var h = '<div class="row" style="margin-bottom:10px"><button class="ok" data-sa="new">+ Sponsor</button></div>';
    h += (SPS.length ? SPS.map(function (s) {
      return '<div class="sp' + (s.active ? '' : '.off') + '" data-id="' + esc(s.id) + '"><img src="' + esc(s.image) + '" alt=""><div><h3>' + esc(s.name) + '</h3>' +
        '<p class="kv">Priorität: ' + (s.priority || 0) + ' | ' + (s.active ? 'Aktiv' : 'Inaktiv') + (s.own ? ' | Eigenwerbung' : '') + '</p>' +
        '<p class="kv">Laufzeit: ' + fmtD(s.start_at) + ' bis ' + fmtD(s.end_at) + '</p>' +
        '<p>' + esc(s.headline_de || '') + '</p>' +
        '<div class="row"><button data-sa="edit" data-id="' + esc(s.id) + '">Bearbeiten</button><button data-sa="toggle" data-id="' + esc(s.id) + '">' + (s.active ? 'Deaktivieren' : 'Aktivieren') + '</button><button data-sa="report" data-id="' + esc(s.id) + '">Report</button><button class="del" data-sa="del" data-id="' + esc(s.id) + '">Löschen</button></div></div></div>';
    }).join('') : '<p>Keine Sponsoren.</p>');
    el('sec').innerHTML = h;
  });
}
function spForm(s) {
  var f = function (t, l, p) { return '<label>' + l + '<input type="text" name="' + t + '" placeholder="' + p + '"></label>'; };
  var cb = function (n, l) { return '<label><input type="checkbox" name="' + n + '" value="1"> ' + l + '</label>'; };
  var places = { slider: 'Startseite-Leiste', native: 'Zwischen Einträgen', after_submit: 'Nach dem Eintragen', quiz: 'Kiez-Quiz' };
  var ko = ['neukoelln', 'kreuzberg', 'wedding', 'gesundbrunnen', 'moabit', 'tiergarten', 'mitte', 'friedrichshain', 'prenzlauer-berg', 'schoeneberg', 'tempelhof', 'charlottenburg', 'spandau', 'reinickendorf', 'steglitz', 'lichtenberg', 'pankow', 'treptow', 'britz', 'koepenick', 'marzahn', 'umgebung'];
  var cats = ['Restaurant', 'Café', 'Bar', 'Shop', 'Service', 'Kultur', 'Schule', 'Sport', 'Sonstiges'];
  el('edBox').innerHTML = '<form class="ed" id="spEd">' +
    '<h3>' + (s ? 'Sponsor bearbeiten' : 'Neuer Sponsor') + '</h3>' +
    '<div class="g3">' + f('name', 'Name', 'Sponsor Name') + f('contact', 'Kontakt', 'Name / E-Mail') + '<label>Priorität (0–10)<input type="number" name="priority" min="0" max="10" value="' + (s && s.priority || 0) + '"></label></div>' +
    '<div class="g3"><label>Kieze (Komma-getrennt)<input type="text" name="kieze" value="' + (s && s.kieze || '') + '"></label><label>Kategorien<input type="text" name="cats" value="' + (s && s.cats || '') + '"></label><label>Plan<input type="text" name="plan" value="' + (s && s.plan || '') + '"></label></div>' +
    '<label>Headline DE<input type="text" name="headline_de" value="' + (s && s.headline_de || '') + '"></label>' +
    '<label>Headline TR<input type="text" name="headline_tr" value="' + (s && s.headline_tr || '') + '"></label>' +
    '<label>Headline EN<input type="text" name="headline_en" value="' + (s && s.headline_en || '') + '"></label>' +
    '<label>CTA DE<input type="text" name="cta_de" value="' + (s && s.cta_de || '') + '"></label>' +
    '<label>CTA TR<input type="text" name="cta_tr" value="' + (s && s.cta_tr || '') + '"></label>' +
    '<label>CTA EN<input type="text" name="cta_en" value="' + (s && s.cta_en || '') + '"></label>' +
    '<div class="g3">' + f('link_web', 'Website-Link', 'https://...') + f('link_wa', 'WhatsApp-Link', 'https://wa.me/...') + f('link_tel', 'Telefon-Link', 'tel:+49...') + '</div>' +
    '<label>Instagram Link<input type="text" name="link_ig" value="' + (s && s.link_ig || '') + '"></label>' +
    '<div class="g3"><label>Start (Datum)<input type="date" name="start" value="' + (s ? fmtD(s.start_at) : '') + '"></label><label>Ende (Datum)<input type="date" name="end" value="' + (s ? fmtD(s.end_at) : '') + '"></label>' +
    '<label>Priorität (0–10)<input type="number" name="priority" min="0" max="10" value="' + (s && s.priority || 0) + '"></label></div>' +
    '<div class="g3">' + f('image', 'Bild-Pfad', '/assets/sponsors/…webp') + '<label>oder Bild hochladen (1200×630)<input type="file" name="image_file" accept="image/jpeg,image/png,image/webp"></label><div></div></div>' +
    '<div class="chkrow">' + cb('slider', 'Startseite-Leiste') + cb('native', 'Zwischen Einträgen') + cb('after_submit', 'Nach dem Eintragen') + cb('quiz', 'Kiez-Quiz') +
    '<label><input type="checkbox" name="own" value="1"' + (s && s.own ? ' checked' : '') + '>Eigenwerbung</label><label><input type="checkbox" name="active" value="1"' + (s && s.active ? ' checked' : '') + '>Aktiv</label></div>' +
    '<div class="row"><button class="ok" type="submit">Speichern</button><button type="button" data-sa="cancel">Abbrechen</button></div></form>';
  el('spEd').onsubmit = function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    fd.set('places', fd.getAll('pl').join(',')); fd.delete('pl');
    if (!fd.get('own')) fd.set('own', '0'); if (!fd.get('active')) fd.set('active', '0');
    fetch('/api/admin/sponsor/save', { method: 'POST', headers: { authorization: 'Bearer ' + TOKEN }, body: fd })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) { el('edBox').innerHTML = ''; loadSp(); } else alert('Bitte prüfen: ' + (j.field || j.error)); });
  };
  el('edBox').scrollIntoView({ behavior: 'smooth' });
}
function spReport(s) {
  var from = new Date(Date.now() - 30 * 864e5).toLocaleDateString('de'), to = new Date().toLocaleDateString('de');
  var ctr = s.imp30 ? (100 * s.clk30 / s.imp30).toFixed(1).replace('.', ',') : '0';
  return 'Berliner Kiez-Check – Werbebericht ' + s.name + '\nZeitraum: ' + from + ' bis ' + to + '\n\nEinblendungen: ' + s.imp30 + '\nKlicks: ' + s.clk30 + '\nKlickrate: ' + ctr + ' %\n\n' +
    'Gezählt wird anonym und ohne Cookies: eine Einblendung, wenn mindestens die Hälfte der Anzeige sichtbar war.\nBerliner Kiez-Check – DeindigitalerhelferCenter';
}
var JST = 'pending';
function loadJobs() {
  call('/api/admin/jobs?status=' + JST).then(function (j) {
    var tabs = ['pending', 'approved', 'rejected'].map(function (s) { return '<button data-js="' + s + '" aria-pressed="' + (s === JST) + '">' + { pending: 'Zu prüfen', approved: 'Online', rejected: 'Abgelehnt' }[s] + '</button>'; }).join('');
    el('sec').innerHTML = '<div class="row" style="margin-bottom:10px">' + tabs + '</div>' + ((j.items || []).length ? j.items.map(function (x) {
      return '<div class="it" style="grid-template-columns:1fr"><div><h3>' + esc(x.title) + ' – ' + esc(x.company) + '</h3>' +
        '<p class="m">' + esc(x.kiez) + ' · ' + esc(x.jobtype) + ' · ' + esc(x.salary || '') + ' · ' + esc(x.languages || '') + '</p>' +
        '<p class="m">' + esc(x.email) + ' · WA ' + esc(x.whatsapp || '-') + ' · Tel ' + esc(x.phone || '-') + ' · läuft bis ' + fmtD(x.expires_at) + (x.urgent_until > Date.now() ? ' · <b>Dringend bis ' + fmtD(x.urgent_until) + '</b>' : '') + '</p>' +
        (x.mod_note ? '<div class="note">KI: ' + esc(x.mod_note) + '</div>' : '') + '<p>' + esc(x.description || '') + '</p>' +
        '<div class="row">' + (JST !== 'approved' ? '<button class="ok" data-ja="approved" data-id="' + esc(x.id) + '">Freigeben</button>' : '') +
        (JST !== 'rejected' ? '<button class="no" data-ja="rejected" data-id="' + esc(x.id) + '">Ablehnen</button>' : '') +
        (JST === 'approved' ? '<button data-ja="edit" data-id="' + esc(x.id) + '">Bearbeiten</button>' : '') +
        '<button class="del" data-ja="delete" data-id="' + esc(x.id) + '">Löschen</button></div></div></div>';
    }).join('') : '<p>Keine Jobs in dieser Ansicht.</p>');
  });
}
function loadReq() {
  call('/api/admin/requests').then(function (j) {
    el('sec').innerHTML = (j.items || []).length ? j.items.map(function (r) {
      return '<div class="it" style="grid-template-columns:1fr' + (r.done ? ';opacity:.55' : '') + '"><div><h3>' + esc(r.company) + ' <small>(' + esc(r.size) + ')</small></h3>' +
        '<p class="m">' + esc(r.person || '') + ' · <a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a> · ' + esc(r.phone || '') + ' · ' + new Date(r.created_at).toLocaleString('de') + '</p>' +
        '<p>' + esc(r.message || '') + '</p><div class="row"><button data-rq="edit" data-id="' + esc(r.id) + '">Bearbeiten</button>' + (r.done ? '' : '<button class="ok" data-rd="' + esc(r.id) + '">Erledigt</button>') + '<button class="del" data-rq="delete" data-id="' + esc(r.id) + '">Löschen</button></div></div></div>';
    }).join('') : '<p>Keine Anfragen.</p>';
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) { showSec(null); return; }
  if (b.dataset.sec) { showSec(b.dataset.sec); return; }
  if (b.dataset.js) { JST = b.dataset.js; loadJobs(); return; }
  if (b.dataset.ja) { if (b.dataset.ja === 'delete' && !confirm('Job löschen?')) return; call('/api/admin/job/set', { id: b.dataset.id, status: b.dataset.ja }).then(loadJobs); return; }
  if (b.dataset.rd) { call('/api/admin/request/done', { id: b.dataset.rd }).then(loadReq); return; }
  if (b.dataset.rq) { if (b.dataset.rq === 'delete' && !confirm('Anfrage löschen?')) return; call('/api/admin/request/set', { id: b.dataset.id, action: b.dataset.rq }).then(loadReq); return; }
  var sa = b.dataset.sa; if (!sa) return;
  var s = SPS.filter(function (x) { return x.id === b.dataset.id; })[0];
  if (sa === 'new') spForm(null);
  else if (sa === 'cancel') el('edBox').innerHTML = '';
  else if (sa === 'edit') spForm(s);
  else if (sa === 'del') { if (confirm('Sponsor „' + s.name + '" löschen?')) call('/api/admin/sponsor/delete', { id: s.id }).then(loadSp); }
  else if (sa === 'report') { var txt = spReport(s); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { alert('Bericht kopiert:\n\n' + txt); }, function () { prompt('Bericht:', txt); }); }
  else if (sa === 'toggle') {
    var fd = new FormData();
    ['id', 'name', 'image', 'headline_de', 'headline_tr', 'headline_en', 'cta_de', 'cta_tr', 'cta_en', 'link_web', 'link_wa', 'link_tel', 'link_ig', 'places', 'kieze', 'cats', 'plan', 'contact', 'priority'].forEach(function (k) { fd.set(k, s[k] == null ? '' : s[k]); });
    fd.set('start', fmtD(s.start_at)); fd.set('end', fmtD(s.end_at)); fd.set('own', s.own ? '1' : '0'); fd.set('active', s.active ? '0' : '1');
    fetch('/api/admin/sponsor/save', { method: 'POST', headers: { authorization: 'Bearer ' + TOKEN }, body: fd }).then(function () { loadSp(); });
  }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ps) { PST = b.dataset.ps; loadPosts(); return; }
  if (b.dataset.pa) {
    if (b.dataset.pa === 'delete' && !confirm('Beitrag und Fotos endgültig löschen?')) return;
    call('/api/admin/post/set', { id: b.dataset.id, status: b.dataset.pa }).then(loadPosts);
  }
});
var PST = 'pending';
function loadPosts() {
  call('/api/admin/posts?status=' + PST).then(function (j) {
    var cnt = {}; (j.counts || []).forEach(function (c) { cnt[c.status] = c.n; });
    var tabs = ['pending', 'approved', 'rejected'].map(function (s) { return '<button data-ps="' + s + '" aria-pressed="' + (s === PST) + '">' + { pending: 'Zu prüfen', approved: 'Online', rejected: 'Abgelehnt' }[s] + ' (' + (cnt[s] || 0) + ')</button>'; }).join('');
    el('sec').innerHTML = '<div class="row" style="margin-bottom:10px">' + tabs + '</div>' + ((j.items || []).length ? j.items.map(function (x) {
      var ph = []; try { ph = JSON.parse(x.photos || '[]'); } catch (e) { }
      return '<div class="it" style="grid-template-columns:1fr"><div><h3>' + esc(x.title) + '</h3>' +
        '<p class="m">' + esc(x.kiez) + ' · ' + new Date(x.created_at).toLocaleString('de') + ' · ' + esc(x.author || '(ohne Namen)') + ' · <a href="mailto:' + esc(x.email) + '">' + esc(x.email) + '</a></p>' +
        (ph.length ? '<div class="row">' + ph.map(function (k) { return '<a href="/img/' + esc(k) + '" target="_blank"><img src="/img/' + esc(k) + '" alt="" style="width:140px;height:100px;object-fit:cover;border:2px solid #121212;border-radius:8px"></a>'; }).join('') + '</div>' : '') +
        '<p style="white-space:pre-wrap">' + esc(x.body) + '</p>' +
        (x.video_url ? '<p class="m">Video: <a href="' + esc(x.video_url) + '" target="_blank" rel="noopener">' + esc(x.video_url) + '</a></p>' : '') +
        '<div class="row">' + (PST !== 'approved' ? '<button class="ok" data-pa="approved" data-id="' + esc(x.id) + '">Freigeben</button>' : '') +
        (PST !== 'rejected' ? '<button class="no" data-pa="rejected" data-id="' + esc(x.id) + '">Ablehnen</button>' : '') +
        (PST === 'approved' ? '<button data-pa="edit" data-id="' + esc(x.id) + '">Bearbeiten</button>' : '') +
        '<button class="del" data-pa="delete" data-id="' + esc(x.id) + '">Löschen (inkl. Fotos)</button></div></div></div>';
    }).join('') : '<p>Keine Beiträge in dieser Ansicht.</p>');
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.a) {
    if (b.dataset.a === 'delete' && !confirm('Eintrag wirklich löschen?')) return;
    call('/api/admin/item/set', { id: e.target.closest('.it').dataset.id, status: b.dataset.a }).then(list);
  }
});
$('#loginBtn').onclick = function () {
  TOKEN = el('tok').value;
  if (!TOKEN) { alert('Token erforderlich'); return; }
  sessionStorage.setItem('kc_admin', TOKEN);
  start();
};
$('#logout').onclick = logout;
if (TOKEN) start();
</script>
