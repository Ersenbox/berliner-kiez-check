<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Berliner Kiez-Check Admin</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--paper:#EEF0EC;--ink:#1C2B39;--pink:#FF48B0;--blue:#0078BF;--yellow:#FFE800;--muted:#4A5866;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#141B22;--ink:#E9ECE6;--muted:#A9B3BC;--card:#1C252E}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--ink)}
header img,header svg{flex-shrink:0;max-width:64px;max-height:64px}
h1{margin:0 auto 0 0;font-size:20px;color:var(--blue)}
button,input{font:inherit;color:inherit}
button{border:2px solid var(--ink);background:var(--card);padding:6px 12px;font-weight:700;cursor:pointer;transition:all 150ms}
button:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
button:active{transform:translateY(0)}
button.ok{background:#1f9d55;color:#fff;border-color:#1f9d55}button.no{background:var(--pink);color:#1C2B39}button.del{background:none;color:var(--muted);border-color:var(--muted)}
button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{max-width:980px;margin:0 auto;padding:16px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-weight:700}
.it{display:grid;grid-template-columns:90px 1fr;gap:14px;border-top:1.5px solid var(--ink);padding:14px 0}
.it img,.ph{width:90px;height:90px;object-fit:cover;border:2px solid var(--ink)}.ph{background:var(--blue)}
.it h3{margin:0}.m{color:var(--muted);font-size:13px;margin:2px 0}
.note{background:var(--yellow);color:#1C2B39;padding:4px 8px;font-size:13px;margin:6px 0;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sp{display:grid;grid-template-columns:160px 1fr;gap:14px;border-top:1.5px solid var(--ink);padding:14px 0}
.sp img{width:160px;aspect-ratio:1200/630;object-fit:contain;background:#fff;border:2px solid var(--ink)}
.sp.off{opacity:.55}
.kv{font-size:13px;color:var(--muted);margin:2px 0}
.big{font-size:20px;font-weight:800}
.ed{display:grid;gap:10px;max-width:760px;border:2px solid var(--ink);background:var(--card);padding:14px;margin:10px 0}
.ed label{display:grid;gap:3px;font-weight:700;font-size:13px}
.ed input,.ed select,.ed textarea{border:2px solid var(--ink);background:var(--paper);padding:7px;font:inherit;color:inherit;width:100%}
.ed textarea{resize:vertical;min-height:80px}
.ed .g2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.ed .g3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.ed .g2,.ed .g3{grid-template-columns:1fr}.sp{grid-template-columns:1fr}.sp img{width:100%}}
.ed .chkrow{display:flex;gap:16px;flex-wrap:wrap}
.ed .chkrow label{display:flex;gap:6px;align-items:center;font-weight:400}
.ed .chkrow input{width:auto}
#login{max-width:420px;margin:60px auto;padding:0 16px}#login input{width:100%;padding:10px;border:2px solid var(--ink);background:var(--card);margin:8px 0}#login button{width:100%;padding:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fadeIn 150ms}
.modal-box{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:20px;max-width:90%;max-height:90vh;overflow-y:auto;width:100%;max-width:700px;position:relative;animation:slideUp 200ms}
.modal-box h2{margin-top:0}
.modal-close{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:24px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--pink)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="login">
  <h1>Berliner Kiez-Check Admin</h1>
  <p>Admin-Token eingeben (wird nur in diesem Tab gespeichert).</p>
  <input id="tok" type="password" autocomplete="off" placeholder="Token hier einfügen">
  <button id="loginBtn">Anmelden</button>
  <p style="color:var(--muted);font-size:13px;margin-top:20px">💡 Dein Token ist sicher - wird nur lokal im Browser gespeichert und NICHT übertragen.</p>
</div>
<div id="app" hidden>
  <header>
    <img id="adminLogo" src="https://raw.githubusercontent.com/Ersenbox/berliner-kiez-check/main/public/assets/logo.svg" alt="Kiez-Check" onerror="this.src='https://raw.githubusercontent.com/Ersenbox/berliner-kiez-check/main/public/assets/logo-kiez-check-128x128.png'">
    <h1>Berliner Kiez-Check Admin</h1>
    <button data-s="pending" aria-pressed="true">Zu prüfen</button>
    <button data-s="approved">Online</button>
    <button data-s="rejected">Abgelehnt</button>
    <button data-sec="sponsors">Sponsoren</button>
    <button data-sec="jobs">Jobs</button>
    <button data-sec="requests">Werbeanfragen</button>
    <button data-sec="posts">Kiez-Reporter</button>
    <button data-sec="stories">Stories</button>
    <button id="logout" style="margin-left:auto">Abmelden</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
    <div id="sec" hidden></div>
  </main>
</div>

<!-- ZENTRAL Edit Modal für ALLE Sektionen -->
<div id="editModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <button class="modal-close" type="button" aria-label="Schließen">&times;</button>
    <div id="editForm"></div>
  </div>
</div>

<script>
var TOKEN = sessionStorage.getItem('kc_admin') || '', ST = 'pending';
var $ = function (s) { return document.querySelector(s); };
function el(s) { return $('#' + s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function call(p, body) {
  return fetch(p, { 
    method: body ? 'POST' : 'GET', 
    headers: Object.assign({ authorization: 'Bearer ' + TOKEN }, body ? { 'content-type': 'application/json' } : {}), 
    body: body ? JSON.stringify(body) : undefined 
  })
    .then(function (r) { 
      if (r.status === 401) { 
        logout(); 
        alert('Session abgelaufen - bitte neu anmelden'); 
        throw new Error('auth'); 
      } 
      return r.json(); 
    })
    .catch(function (err) { 
      console.error('API Fehler:', err);
      throw err;
    });
}

function logout() { 
  TOKEN = ''; 
  sessionStorage.removeItem('kc_admin'); 
  el('app').hidden = true; 
  el('login').hidden = false; 
  el('tok').value = '';
  el('tok').focus();
}

function showSec(name) { 
  if (!name) { 
    el('sec').hidden = true; 
    el('list').hidden = false; 
  } else { 
    el('sec').hidden = false; 
    el('list').hidden = true; 
    if (name === 'sponsors') loadSp(); 
    else if (name === 'jobs') loadJobs(); 
    else if (name === 'requests') loadReq(); 
    else if (name === 'posts') loadPosts(); 
    else if (name === 'stories') loadStories(); 
  } 
}

function openEditModal(html) { 
  el('editForm').innerHTML = html; 
  el('editModal').hidden = false; 
  el('editModal').focus();
}

function closeEditModal() { 
  el('editModal').hidden = true; 
  el('editForm').innerHTML = ''; 
}

function start() {
  el('login').hidden = true; 
  el('app').hidden = false;
  call('/api/admin/stats').then(function (s) {
    var c = {}; 
    (s.counts || []).forEach(function (x) { c[x.status] = x.n; });
    el('stats').innerHTML = '<span>Zu prüfen: ' + (c.pending || 0) + '</span><span>Online: ' + (c.approved || 0) + '</span><span>Hervorgehoben: ' + (s.featured || 0) + '</span><span>Umsatz 30 Tage: ' + ((s.revenue30 || 0) / 100).toFixed(2).replace('.', ',') + ' €</span>';
  }).catch(function (err) { 
    alert('Backend-Fehler: Kann Stats nicht laden.\n' + err.message); 
    logout();
  });
  list();
}

function list() {
  call('/api/admin/list?status=' + ST).then(function (j) {
    el('list').innerHTML = (j.items || []).length ? (j.items || []).map(function (it) {
      return '<div class="it" data-id="' + esc(it.id) + '">' + (it.photo_key ? '<img src="/img/' + esc(it.photo_key) + '?v=' + it.updated_at + '" alt="">' : '<div class="ph"></div>') +
        '<div><h3>' + esc(it.name) + '</h3><p class="m">' + esc(it.kiez) + (it.kiez_note ? ' (' + esc(it.kiez_note) + ')' : '') + ' / ' + esc(it.category) + (it.cat_note ? ' (' + esc(it.cat_note) + ')' : '') + ' – ' + esc(it.address) + '</p>' +
        '<p class="m">' + esc(it.email) + (it.phone ? ' · ' + esc(it.phone) : '') + (it.website ? ' · <a href="' + esc(it.website) + '" target="_blank" rel="noopener">' + esc(it.website) + '</a>' : '') + (it.instagram ? ' · @' + esc(it.instagram) : '') + '</p>' +
        (it.mod_note ? '<div class="note">KI: ' + esc(it.mod_note) + '</div>' : '') +
        '<p>' + esc(it.desc_de) + '</p><p class="m">TR: ' + esc(it.desc_tr) + '</p>' +
        (it.featured_until > Date.now() ? '<p class="m"><b>Hervorgehoben bis ' + new Date(it.featured_until).toLocaleDateString('de') + '</b></p>' : '') +
        '<div class="row">' + (ST !== 'approved' ? '<button class="ok" data-a="approved">Freigeben</button>' : '') + (ST !== 'rejected' ? '<button class="no" data-a="rejected">Ablehnen</button>' : '') +
        (ST === 'approved' ? '<button data-a="edit" data-id="' + esc(it.id) + '">Bearbeiten</button>' : '') +
        '<button class="del" data-a="delete">Löschen</button></div></div></div>';
    }).join('') : '<p>Nichts zu tun. 🎉</p>';
  }).catch(function (err) { alert('Fehler beim Laden der Liste: ' + err.message); });
}

function fmtD(ms) { return ms ? new Date(ms).toLocaleDateString('de', { year: 'numeric', month: '2-digit', day: '2-digit' }) : ''; }

// ===== MAIN LIST EDIT (ITEM) =====
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); 
  if (!b || !b.dataset.a) return;
  var itEl = b.closest('.it');
  var id = itEl.dataset.id;
  
  if (b.dataset.a === 'edit') {
    call('/api/admin/item/' + id).then(function (it) {
      var html = '<h2>Eintrag bearbeiten: ' + esc(it.name) + '</h2>' +
        '<form class="ed" data-type="item" data-id="' + esc(it.id) + '">' +
        '<label>Name<input type="text" name="name" value="' + esc(it.name) + '"></label>' +
        '<div class="g2"><label>Kiez<input type="text" name="kiez" value="' + esc(it.kiez) + '"></label><label>Kategorie<input type="text" name="category" value="' + esc(it.category) + '"></label></div>' +
        '<label>Adresse<input type="text" name="address" value="' + esc(it.address) + '"></label>' +
        '<div class="g2"><label>Email<input type="email" name="email" value="' + esc(it.email) + '"></label><label>Telefon<input type="tel" name="phone" value="' + esc(it.phone || '') + '"></label></div>' +
        '<div class="g2"><label>Website<input type="url" name="website" value="' + esc(it.website || '') + '"></label><label>Instagram<input type="text" name="instagram" value="' + esc(it.instagram || '') + '"></label></div>' +
        '<label>Beschreibung DE<textarea name="desc_de">' + esc(it.desc_de) + '</textarea></label>' +
        '<label>Beschreibung TR<textarea name="desc_tr">' + esc(it.desc_tr) + '</textarea></label>' +
        '<div class="row"><button class="ok" type="submit">Speichern</button><button type="button" data-close>Abbrechen</button></div>' +
        '</form>';
      openEditModal(html);
    }).catch(function (err) { alert('Fehler beim Laden: ' + err.message); });
    return;
  }
  
  if (b.dataset.a === 'delete' && !confirm('Eintrag wirklich löschen?')) return;
  call('/api/admin/item/set', { id: id, status: b.dataset.a }).then(list).catch(function (err) { alert('Fehler: ' + err.message); });
});

// ===== JOBS =====
var JST = 'pending';
window.loadJobs = function () {
  call('/api/admin/jobs?status=' + JST).then(function (j) {
    var tabs = [['pending', 'Zu prüfen'], ['approved', 'Online'], ['old', 'Abgelaufen']].map(function (s) {
      return '<button data-js="' + s[0] + '" aria-pressed="' + (s[0] === JST) + '">' + s[1] + ' (' + ((j.counts || {})[s[0]] || 0) + ')</button>';
    }).join('');
    var h = '<div class="row" style="margin-bottom:10px">' + tabs + '</div>';
    h += (j.items || []).length ? (j.items || []).map(jobItem).join('') : '<p>Keine Jobs in dieser Ansicht.</p>';
    el('sec').innerHTML = h;
  }).catch(function (err) { alert('Fehler beim Laden von Jobs: ' + err.message); });
};
function jobItem(x) {
  var acts = '<button data-ja="edit" data-id="' + esc(x.id) + '">Bearbeiten</button>' +
    (JST === 'pending' ? '<button class="ok" data-ja="approved" data-id="' + esc(x.id) + '">Freigeben</button>' : '') +
    '<button class="del" data-ja="delete" data-id="' + esc(x.id) + '">Löschen</button>';
  return '<div class="it"><div class="ph"></div><div><h3>' + esc(x.title) + '</h3>' +
    '<p class="m">' + esc(x.company) + ' · ' + esc(x.kiez) + ' · ' + esc(x.jobtype) + '</p>' +
    '<p>' + esc(x.description) + '</p>' +
    '<p class="m">Kontakt: ' + esc(x.email) + (x.phone ? ' · ' + esc(x.phone) : '') + '</p>' +
    '<div class="row">' + acts + '</div></div></div>';
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.ja === 'edit') {
    var id = b.dataset.id;
    call('/api/admin/job/' + id).then(function (x) {
      var html = '<h2>Job bearbeiten: ' + esc(x.title) + '</h2>' +
        '<form class="ed" data-type="job" data-id="' + esc(x.id) + '">' +
        '<label>Titel<input type="text" name="title" value="' + esc(x.title) + '"></label>' +
        '<label>Unternehmen<input type="text" name="company" value="' + esc(x.company) + '"></label>' +
        '<div class="g2"><label>Kiez<input type="text" name="kiez" value="' + esc(x.kiez) + '"></label><label>Job-Typ<input type="text" name="jobtype" value="' + esc(x.jobtype) + '"></label></div>' +
        '<label>Beschreibung<textarea name="description">' + esc(x.description) + '</textarea></label>' +
        '<label>Email<input type="email" name="email" value="' + esc(x.email) + '"></label>' +
        '<label>Telefon<input type="tel" name="phone" value="' + esc(x.phone || '') + '"></label>' +
        '<label>WhatsApp<input type="tel" name="whatsapp" value="' + esc(x.whatsapp || '') + '"></label>' +
        '<div class="row"><button class="ok" type="submit">Speichern</button><button type="button" data-close>Abbrechen</button></div>' +
        '</form>';
      openEditModal(html);
    }).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.ja === 'delete' && !confirm('Job löschen?')) return;
  if (b.dataset.ja === 'approved') {
    call('/api/admin/job/set', { id: b.dataset.id, status: 'approved' }).then(loadJobs).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.ja === 'delete') {
    call('/api/admin/job/set', { id: b.dataset.id, status: 'delete' }).then(loadJobs).catch(function (err) { alert('Fehler: ' + err.message); });
  }
});

// ===== REQUESTS =====
var RST = 'pending';
window.loadReq = function () {
  call('/api/admin/requests?status=' + RST).then(function (j) {
    var tabs = [['pending', 'Zu prüfen'], ['approved', 'Online']].map(function (s) {
      return '<button data-rs="' + s[0] + '" aria-pressed="' + (s[0] === RST) + '">' + s[1] + ' (' + ((j.counts || {})[s[0]] || 0) + ')</button>';
    }).join('');
    var h = '<div class="row" style="margin-bottom:10px">' + tabs + '</div>';
    h += (j.items || []).length ? (j.items || []).map(reqItem).join('') : '<p>Keine Werbeanfragen in dieser Ansicht.</p>';
    el('sec').innerHTML = h;
  }).catch(function (err) { alert('Fehler beim Laden: ' + err.message); });
};
function reqItem(x) {
  var acts = '<button data-rq="edit" data-id="' + esc(x.id) + '">Bearbeiten</button>' +
    (RST === 'pending' ? '<button class="ok" data-rq="approved" data-id="' + esc(x.id) + '">Freigeben</button>' : '') +
    '<button class="del" data-rq="delete" data-id="' + esc(x.id) + '">Löschen</button>';
  return '<div class="it"><div class="ph"></div><div><h3>' + esc(x.company) + '</h3>' +
    '<p class="m">Kontakt: ' + esc(x.person) + ' · ' + esc(x.email) + (x.phone ? ' · ' + esc(x.phone) : '') + '</p>' +
    '<p>' + esc(x.message) + '</p>' +
    '<div class="row">' + acts + '</div></div></div>';
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.rq === 'edit') {
    var id = b.dataset.id;
    call('/api/admin/request/' + id).then(function (x) {
      var html = '<h2>Werbeanfrage bearbeiten</h2>' +
        '<form class="ed" data-type="request" data-id="' + esc(x.id) + '">' +
        '<label>Unternehmen<input type="text" name="company" value="' + esc(x.company) + '"></label>' +
        '<label>Ansprechpartner<input type="text" name="person" value="' + esc(x.person) + '"></label>' +
        '<label>Email<input type="email" name="email" value="' + esc(x.email) + '"></label>' +
        '<label>Telefon<input type="tel" name="phone" value="' + esc(x.phone || '') + '"></label>' +
        '<label>Nachricht<textarea name="message">' + esc(x.message) + '</textarea></label>' +
        '<div class="row"><button class="ok" type="submit">Speichern</button><button type="button" data-close>Abbrechen</button></div>' +
        '</form>';
      openEditModal(html);
    }).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.rs) { RST = b.dataset.rs; loadReq(); return; }
  if (b.dataset.rq === 'approved') {
    call('/api/admin/request/set', { id: b.dataset.id, status: 'approved' }).then(loadReq).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.rq === 'delete' && !confirm('Löschen?')) return;
  if (b.dataset.rq === 'delete') {
    call('/api/admin/request/set', { id: b.dataset.id, status: 'delete' }).then(loadReq).catch(function (err) { alert('Fehler: ' + err.message); });
  }
});

// ===== POSTS (Kiez-Reporter) =====
var PST = 'pending';
window.loadPosts = function () {
  call('/api/admin/posts?status=' + PST).then(function (j) {
    var tabs = [['pending', 'Zu prüfen'], ['approved', 'Online']].map(function (s) {
      return '<button data-ps="' + s[0] + '" aria-pressed="' + (s[0] === PST) + '">' + s[1] + ' (' + ((j.counts || {})[s[0]] || 0) + ')</button>';
    }).join('');
    var h = '<div class="row" style="margin-bottom:10px">' + tabs + '</div>';
    h += (j.items || []).length ? (j.items || []).map(postItem).join('') : '<p>Keine Posts in dieser Ansicht.</p>';
    el('sec').innerHTML = h;
  }).catch(function (err) { alert('Fehler beim Laden: ' + err.message); });
};
function postItem(x) {
  var acts = '<button data-pa="edit" data-id="' + esc(x.id) + '">Bearbeiten</button>' +
    (PST === 'pending' ? '<button class="ok" data-pa="approved" data-id="' + esc(x.id) + '">Freigeben</button>' : '') +
    '<button class="del" data-pa="delete" data-id="' + esc(x.id) + '">Löschen</button>';
  return '<div class="it"><div class="ph"></div><div><h3>' + esc(x.title) + '</h3>' +
    '<p class="m">' + esc(x.kiez) + ' · ' + esc(x.author) + '</p>' +
    '<p>' + esc(x.body) + '</p>' +
    '<div class="row">' + acts + '</div></div></div>';
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pa === 'edit') {
    var id = b.dataset.id;
    call('/api/admin/post/' + id).then(function (x) {
      var html = '<h2>Post bearbeiten: ' + esc(x.title) + '</h2>' +
        '<form class="ed" data-type="post" data-id="' + esc(x.id) + '">' +
        '<label>Titel<input type="text" name="title" value="' + esc(x.title) + '"></label>' +
        '<label>Kiez<input type="text" name="kiez" value="' + esc(x.kiez) + '"></label>' +
        '<label>Autor<input type="text" name="author" value="' + esc(x.author) + '"></label>' +
        '<label>Email<input type="email" name="email" value="' + esc(x.email) + '"></label>' +
        '<label>Text<textarea name="body">' + esc(x.body) + '</textarea></label>' +
        '<div class="row"><button class="ok" type="submit">Speichern</button><button type="button" data-close>Abbrechen</button></div>' +
        '</form>';
      openEditModal(html);
    }).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.ps) { PST = b.dataset.ps; loadPosts(); return; }
  if (b.dataset.pa === 'approved') {
    call('/api/admin/post/set', { id: b.dataset.id, status: 'approved' }).then(loadPosts).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.pa === 'delete' && !confirm('Post löschen?')) return;
  if (b.dataset.pa === 'delete') {
    call('/api/admin/post/set', { id: b.dataset.id, status: 'delete' }).then(loadPosts).catch(function (err) { alert('Fehler: ' + err.message); });
  }
});

// ===== SPONSORS =====
window.loadSp = function () {
  call('/api/admin/sponsors').then(function (j) {
    var h = '';
    h += (j.items || []).length ? (j.items || []).map(function (x) {
      return '<div class="sp' + (x.expires_at < Date.now() ? ' off' : '') + '"><img src="' + esc(x.image_url) + '" alt="' + esc(x.company) + '"><div><h3>' + esc(x.company) + '</h3><p class="kv">Bis: ' + new Date(x.expires_at).toLocaleDateString('de') + '</p><p>' + esc(x.description) + '</p><button data-sp="edit" data-id="' + esc(x.id) + '">Bearbeiten</button> <button data-sp="delete" data-id="' + esc(x.id) + '" class="del">Löschen</button></div></div>';
    }).join('') : '<p>Keine Sponsoren.</p>';
    el('sec').innerHTML = h;
  }).catch(function (err) { alert('Fehler beim Laden: ' + err.message); });
};
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.sp === 'edit') {
    var id = b.dataset.id;
    call('/api/admin/sponsor/' + id).then(function (x) {
      var html = '<h2>Sponsor bearbeiten: ' + esc(x.company) + '</h2>' +
        '<form class="ed" data-type="sponsor" data-id="' + esc(x.id) + '">' +
        '<label>Unternehmen<input type="text" name="company" value="' + esc(x.company) + '"></label>' +
        '<label>Bild-URL<input type="url" name="image_url" value="' + esc(x.image_url) + '"></label>' +
        '<label>Beschreibung<textarea name="description">' + esc(x.description) + '</textarea></label>' +
        '<label>Gültig bis<input type="date" name="expires_at" value="' + fmtD(new Date(x.expires_at)) + '"></label>' +
        '<div class="row"><button class="ok" type="submit">Speichern</button><button type="button" data-close>Abbrechen</button></div>' +
        '</form>';
      openEditModal(html);
    }).catch(function (err) { alert('Fehler: ' + err.message); });
    return;
  }
  if (b.dataset.sp === 'delete' && !confirm('Sponsor löschen?')) return;
  if (b.dataset.sp === 'delete') {
    call('/api/admin/sponsor/set', { id: b.dataset.id, status: 'delete' }).then(loadSp).catch(function (err) { alert('Fehler: ' + err.message); });
  }
});

// ===== FORM SUBMISSION =====
document.addEventListener('submit', function (e) {
  if (!e.target.classList.contains('ed')) return;
  e.preventDefault();
  var form = e.target, type = form.dataset.type, id = form.dataset.id;
  var data = new FormData(form);
  var body = {};
  data.forEach(function (val, key) { body[key] = val; });
  body.id = id;
  
  var endpoint = '/api/admin/' + type + '/set';
  var btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  var orig = btn.textContent;
  btn.textContent = 'Speichert...';
  
  fetch(endpoint, { method: 'POST', headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      btn.disabled = false;
      btn.textContent = orig;
      if (j.ok || j.success) {
        closeEditModal();
        if (type === 'item') list();
        else if (type === 'job') loadJobs();
        else if (type === 'post') loadPosts();
        else if (type === 'request') loadReq();
        else if (type === 'sponsor') loadSp();
        else if (type === 'story') loadStories();
      } else {
        alert('Fehler: ' + (j.error || j.message || 'Unbekannter Fehler'));
      }
    })
    .catch(function (err) { 
      btn.disabled = false;
      btn.textContent = orig;
      alert('Speichern fehlgeschlagen: ' + err.message); 
    });
});

// ===== MODAL CLOSE =====
el('editModal').addEventListener('click', function (e) {
  if (e.target === el('editModal') || e.target.closest('[data-close]')) {
    closeEditModal();
  }
});

// ===== HEADER TABS =====
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); 
  if (!b) return;
  if (b.dataset.s) { 
    showSec(null); 
    ST = b.dataset.s; 
    document.querySelectorAll('[data-s]').forEach(function (btn) { btn.setAttribute('aria-pressed', false); });
    b.setAttribute('aria-pressed', true);
    list(); 
    return; 
  }
  if (b.dataset.sec) { 
    showSec(b.dataset.sec); 
    return; 
  }
  if (b.dataset.js) { 
    JST = b.dataset.js; 
    loadJobs(); 
    return; 
  }
});

// ===== LOGIN =====
el('loginBtn').onclick = function () {
  var tok = el('tok').value.trim();
  if (!tok) { 
    alert('Token erforderlich'); 
    el('tok').focus();
    return; 
  }
  TOKEN = tok;
  sessionStorage.setItem('kc_admin', TOKEN);
  start();
};

el('logout').onclick = logout;

// Auto-login if token exists
if (TOKEN) start();
el('tok').focus();
</script>
