var lang = (function () { var l = new URLSearchParams(location.search).get('lang'); try { l = l || localStorage.getItem('kc_lang'); } catch (e) { } l = l || (navigator.language || 'de').slice(0, 2); return T[l] ? l : 'de'; })();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function apply() {
  var d = T[lang]; document.documentElement.lang = lang;
  try { localStorage.setItem('kc_lang', lang); } catch (e) { }
  document.querySelectorAll('[data-i]').forEach(function (el) { el.textContent = d[el.getAttribute('data-i')]; });
  document.querySelectorAll('.langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.l === lang); });
  document.getElementById('consent').innerHTML = esc(d.consent).replace('{ds}', '<a href="' + document.getElementById('ds').href + '" target="_blank" rel="noopener">' + esc(d.ds_word) + '</a>');
}
document.querySelectorAll('.langs button').forEach(function (b) { b.onclick = function () { lang = b.dataset.l; apply(); }; });
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, g = function (k) { return f.elements[k].value.trim(); };
  if (!f.elements.consent.checked || !f.reportValidity()) return;
  var btn = f.querySelector('button'); btn.disabled = true;
  fetch('/api/werben', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ company: g('company'), person: g('person'), email: g('email'), phone: g('phone'), size: g('size'), message: g('message'), hp: g('hp') }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok) document.getElementById('formBox').innerHTML = '<p class="ok">' + esc(T[lang].ok) + '</p>';
      else { alert(j.error === 'rate' ? T[lang].err_rate : T[lang].err); btn.disabled = false; }
    }).catch(function () { alert(T[lang].err_net); btn.disabled = false; });
});
var pre = new URLSearchParams(location.search).get('size'); if (pre) document.querySelector('select[name=size]').value = pre;
apply();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(function () { });

(function () {
  var btn = document.getElementById('themeBtn'), root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { var a = root.getAttribute('data-theme'); return a ? a === 'dark' : !!(mq && mq.matches); }
  function paint() { btn.textContent = isDark() ? '☀️' : '🌙'; }
  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('kc_theme', next); } catch (e) { }
    paint();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', paint);
  paint();
})();
