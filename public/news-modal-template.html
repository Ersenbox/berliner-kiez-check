<!-- NEWS MODAL DIALOG -->
<div id="newsModal" class="news-modal">
  <div class="news-modal-content" style="position: relative;">
    
    <!-- Close Button X -->
    <button class="btn-close-x" onclick="closeNewsModal()">✕</button>
    
    <!-- Logo -->
    <img src="/assets/logo-kiez-check.svg" alt="Berliner Kiez-Check" class="news-logo">
    
    <!-- Dynamisches Bild je nach Modal -->
    <img id="newsImage" src="" alt="" class="news-image">
    
    <!-- Titel -->
    <h2 id="newsTitle">Berlin</h2>
    
    <!-- Beschreibung -->
    <p id="newsDescription">
      Beschreibung wird hier angezeigt...
    </p>
    
    <!-- Close Button -->
    <button class="btn-close" onclick="closeNewsModal()">Schließen</button>
  </div>
</div>

<!-- JAVASCRIPT für News Modal -->
<script>
// Funktion um News Modal zu öffnen
function showNewsModal(title, description, imageUrl) {
  const modal = document.getElementById('newsModal');
  const titleEl = document.getElementById('newsTitle');
  const descEl = document.getElementById('newsDescription');
  const imgEl = document.getElementById('newsImage');
  
  titleEl.textContent = title;
  descEl.textContent = description;
  imgEl.src = imageUrl;
  imgEl.alt = title;
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';  // Verhindere Scrollen wenn Modal offen
}

// Funktion um News Modal zu schließen
function closeNewsModal() {
  const modal = document.getElementById('newsModal');
  modal.classList.remove('active');
  document.body.style.overflow = 'auto';  // Scrollen wieder aktivieren
}

// Modal mit Esc-Taste schließen
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeNewsModal();
  }
});

// Modal auch schließen wenn außerhalb geklickt wird
document.getElementById('newsModal').addEventListener('click', function(event) {
  if (event.target === this) {
    closeNewsModal();
  }
});

// BEISPIEL-BUTTONS auf der Seite (ersetze mit echten Daten):
// <button onclick="showNewsModal('Tiergarten', 'Der Tiergarten ist...', '/assets/tiergarten.jpg')">Info: Tiergarten</button>
// <button onclick="showNewsModal('Berlin', 'Berlin ist die Hauptstadt...', '/assets/berlin-skyline.jpg')">Info: Berlin</button>
</script>
